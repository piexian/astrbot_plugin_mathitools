name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main, ci/platform-benchmark]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "core/**"
      - "main.py"
      - "math_tools.py"
      - "schema.py"
      - "result.py"
      - "metadata.yaml"
      - "_conf_schema.json"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "core/**"
      - "main.py"
      - "math_tools.py"
      - "schema.py"
      - "result.py"
      - "metadata.yaml"
      - "_conf_schema.json"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "astrbot==4.29.1"
      - name: Run preflight benchmarks
        run: python -B benchmarks/run.py --output benchmark-results/report.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-results/report.json
            benchmark-results/preflight_logs/
          if-no-files-found: error
          retention-days: 7
